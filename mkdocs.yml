site_name: Setup Guides
site_description: Guias de instalacion y configuracion para proyectos Ruby on Rails.
repo_url: https://github.com/IIC2143/Setup-Guides

theme:
  name: material
  language: es
  logo: assets/ruby-gem.svg
  favicon: assets/ruby-gem.svg
  palette:
    - scheme: default
      primary: custom
      accent: red
  features:
    - navigation.sections
    - navigation.top
    - search.suggest
    - content.code.copy

nav:
  - Inicio: index.md
  - Setup:
      - Ubuntu y WSL: guides/setup/ubuntu.md
      - macOS con RVM: guides/setup/macos-rvm.md
      - macOS con rbenv: guides/setup/macos-rbenv.md
      - Actualizar Rails: guides/setup/actualizar-rails.md
  - Herramientas:
      - RuboCop: guides/tools/rubocop.md
      - Devise: guides/tools/devise.md
  - Workflow:
      - Git y Pull Requests: guides/workflow/git-pull-requests.md
  - AI Starter Kit:
      - Inicio: guides/ai-starter-kit/index.md
      - Setup con IA: guides/ai-starter-kit/setup.md
      - AI Tools: guides/ai-starter-kit/ai-tools.md
      - Spec Workflow: guides/ai-starter-kit/spec-workflow.md
  - Templates:
      - Prompt de tarea con IA: template/ai-task-prompt-template.md
      - Pull Request: template/pull-request-template.md
      - Skill reutilizable: template/skill-template.md

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences

extra_css:
  - stylesheets/extra.css
